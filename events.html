<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Events · BISA</title>
<meta name="description" content="BISA event highlights and the full archive of past events, 2017 to today.">
<meta name="theme-color" content="#070b24">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preload" href="assets/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/fraunces-italic.woff2" as="font" type="font/woff2" crossorigin>
<script>document.documentElement.classList.add('js')</script>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="events">
<!-- Events page: a few highlights shown big, then every event on a sideways strip with a year picker -->
<script src="assets/js/layout.js"></script>

<main id="top">

<!-- Highlights: a full-screen stage that pins. The scroll steps through a few events shown big.
     Which events appear is set in content.js under "highlights" -->
<section class="hl band--nila" id="highlights">
  <div class="hl__track">
    <div class="hl__stick">
      <div class="wrap hl__grid">
        <h2 class="eyebrow"><i>Acara</i><span>Event highlights</span></h2>
        <ol class="hl__items" id="hl-items"></ol>
        <div class="hl__foot">
          <p class="mono hl__cue" aria-hidden="true">Scroll <svg><use href="#i-chev"/></svg></p>
          <ol class="hl__rail" id="hl-rail"></ol>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Archive: every event on one sideways strip, newest first. The year buttons jump along it -->
<section class="band band--mori ar" id="archive">
  <div class="wrap">
    <div class="ar__head">
      <div>
        <p class="eyebrow" data-reveal><i>Arsip</i><span>All events</span></p>
        <h2 class="h2" data-reveal>The <em>archive.</em></h2>
      </div>
      <div class="ar__nav" data-reveal>
        <button class="ar__arrow ar__arrow--prev" type="button" id="ar-prev" aria-label="Scroll the archive back"><svg aria-hidden="true"><use href="#i-down"/></svg></button>
        <button class="ar__arrow ar__arrow--next" type="button" id="ar-next" aria-label="Scroll the archive forward"><svg aria-hidden="true"><use href="#i-down"/></svg></button>
      </div>
    </div>
    <div class="years" id="ar-years" role="group" aria-label="Jump to a year" data-reveal></div>
  </div>
  <ol class="ar__strip" id="ar-strip"></ol>
  <div class="wrap">
    <div class="ar__bar" aria-hidden="true"><i id="ar-bar"></i></div>
    <p class="ar__foot mono" id="ar-foot"></p>
  </div>
</section>

<dialog class="lb" id="lb" aria-label="Event photo">
  <figure>
    <img id="lb-img" alt="">
    <figcaption><span id="lb-cap"></span><span class="mono" id="lb-pos"></span></figcaption>
  </figure>
  <button class="lb__btn lb__prev" type="button" id="lb-prev" aria-label="Previous event"><svg aria-hidden="true"><use href="#i-down"/></svg></button>
  <button class="lb__btn lb__next" type="button" id="lb-next" aria-label="Next event"><svg aria-hidden="true"><use href="#i-down"/></svg></button>
  <button class="lb__btn lb__close" type="button" id="lb-close" aria-label="Close"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
</dialog>

</main>

<script src="assets/js/content.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team · BISA</title>
<meta name="description" content="Meet the officers and departments that run BISA.">
<meta name="theme-color" content="#070b24">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preload" href="assets/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/fraunces-italic.woff2" as="font" type="font/woff2" crossorigin>
<script>document.documentElement.classList.add('js')</script>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="team">
<!-- Team page: officers, departments and how elections work -->
<script src="assets/js/layout.js"></script>

<main id="top">

<section class="band band--mori team" id="team">
  <div class="wrap">
    <div class="team__head">
      <div>
        <p class="eyebrow" data-reveal><i>Pengurus</i><span>BISA’s team</span></p>
        <h2 class="h2" data-reveal>Run by students<br>who <em>wear batik well.</em></h2>
      </div>
      <p class="team__lede" data-reveal>Officers are selected through an election near the end of every Spring Semester by members of BISA. Candidates submit an application, interview, and deliver a speech on election night.</p>
    </div>

    <div class="team__groups">
      <figure data-reveal data-par="-0.03"><div class="ph"><img src="assets/img/team-exec.webp" width="1400" height="935" loading="lazy" alt="Four members of the executive team in batik"></div><figcaption class="mono">Executive Team</figcaption></figure>
      <figure data-reveal data-par="0.05" style="--i:1"><div class="ph"><img src="assets/img/team-socials.webp" width="1400" height="935" loading="lazy" alt="Five officers from the events and socials team"></div><figcaption class="mono">Events and Socials</figcaption></figure>
    </div>

    <ul class="people" id="people"></ul>

    <div class="depts" data-reveal>
      <p class="mono">Seven departments</p>
      <p class="depts__list" id="depts"></p>
    </div>
  </div>
</section>

</main>

<script src="assets/js/content.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
